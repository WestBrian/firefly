version = 1
name = "firefly"

[setup]
script = ""

[setup.darwin]
script = '''
src="$CODEX_SOURCE_TREE_PATH/.env.local"
dest="$CODEX_WORKTREE_PATH/.env.local"

if [ -f "$src" ] && [ ! -e "$dest" ] && [ ! -L "$dest" ]; then
  cp "$src" "$dest"
fi

cd "$CODEX_WORKTREE_PATH" || exit 1
npm ci'''

[setup.win32]
script = '''
$src = Join-Path $env:CODEX_SOURCE_TREE_PATH ".env.local"
$dest = Join-Path $env:CODEX_WORKTREE_PATH ".env.local"

if ((Test-Path -LiteralPath $src -PathType Leaf) -and
    !(Test-Path -LiteralPath $dest)) {
    Copy-Item -LiteralPath $src -Destination $dest
}

Set-Location -LiteralPath $env:CODEX_WORKTREE_PATH
npm ci'''
